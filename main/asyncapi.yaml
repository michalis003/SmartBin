asyncapi: 2.6.0
info:
  title: Smart Wastebin MQTT Interface (Team 09)
  version: 1.1.0
  description: >
    Event-driven architecture for the Smart Wastebin system. 
    Handles PIR motion events, virtual sensor usage analysis, health states (LWT), 
    geo-coordinates, and Home Assistant syncing.

servers:
  raspberry_pi_broker:
    url: mqtt://localhost:1883
    protocol: mqtt
    description: The Mosquitto broker running on the edge device/host network.

channels:
  smartbin/{bin_id}/{device_id}/events:
    description: Stream of raw motion detection events from a specific sensor.
    parameters:
      bin_id:
        description: The ID of the wastebin (e.g., bin-01)
        schema: { type: string }
      device_id:
        description: The ID of the sensor (e.g., pir-01)
        schema: { type: string }
    subscribe:
      summary: Read motion events (Consumer & Analyzer)
      operationId: subscribeToMotionEvents
      message:
        $ref: '#/components/messages/MotionEvent'

  smartbin/{bin_id}/{device_id}/usage:
    description: Virtual sensor output evaluating the traffic/usage level of the bin.
    parameters:
      bin_id: { schema: { type: string } }
      device_id: { schema: { type: string } }
    subscribe:
      summary: Read bin usage levels (Analyzer output)
      operationId: subscribeToUsageLevels
      message:
        $ref: '#/components/messages/UsageLevelUpdate'

  smartbin/{bin_id}/{device_id}/state:
    description: Simple text payload for Home Assistant binary sensor state (detected/clear).
    parameters:
      bin_id: { schema: { type: string } }
      device_id: { schema: { type: string } }
    subscribe:
      summary: Read binary motion state
      operationId: subscribeToHAState
      message:
        $ref: '#/components/messages/HAStateMessage'

  smartbin/{bin_id}/{device_id}/availability:
    description: Last Will and Testament (LWT) topic indicating node health (online/offline).
    parameters:
      bin_id: { schema: { type: string } }
      device_id: { schema: { type: string } }
    subscribe:
      summary: Read device online status
      operationId: subscribeToAvailability
      message:
        $ref: '#/components/messages/AvailabilityMessage'

  smartbin/{bin_id}/{device_id}/coorditates:
    description: Retained topic containing the dynamic or static GPS coordinates of the bin.
    parameters:
      bin_id: { schema: { type: string } }
      device_id: { schema: { type: string } }
    subscribe:
      summary: Read bin geo-coordinates
      operationId: subscribeToCoordinates
      message:
        $ref: '#/components/messages/CoordinatesPayload'

  smartbin/{bin_id}/{device_id}/cleared:
    description: Incoming command to reset the sequence number when the bin is physically emptied.
    parameters:
      bin_id: { schema: { type: string } }
      device_id: { schema: { type: string } }
    publish:
      summary: Send clear command to Producer
      operationId: publishClearedState
      message:
        $ref: '#/components/messages/ClearedCommand'

  smartbin/{bin_id}/{device_id}/seq:
    description: The current capacity count (sequence). Retained for state synchronization.
    parameters:
      bin_id: { schema: { type: string } }
      device_id: { schema: { type: string } }
    subscribe:
      summary: Read current sequence number
      operationId: subscribeToSeq
      message:
        $ref: '#/components/messages/SeqSyncMessage'

  smartbin/{bin_id}/status:
    description: Operational status updates for the wastebin (published by REST API when emptied).
    parameters:
      bin_id: { schema: { type: string } }
    subscribe:
      summary: Read global bin status
      operationId: subscribeToBinStatus
      message:
        $ref: '#/components/messages/BinStatusUpdate'

components:
  messages:
    MotionEvent:
      name: MotionEvent
      title: PIR Motion Event (JSON-LD)
      contentType: application/json
      payload:
        type: object
        properties:
          "@context": { type: string }
          "@type": { type: string }
          madeBySensor: { type: string }
          hasFeatureOfInterest: { type: string }
          event_time: { type: string, format: date-time }
          event_type: { type: string }
          motion_state: { type: string }
          seq: { type: integer }
          run_id: { type: string }

    UsageLevelUpdate:
      name: UsageLevelUpdate
      contentType: application/json
      payload:
        type: object
        properties:
          usage_level: { type: string, enum: [idle, low, medium, high] }
          event_count: { type: integer }
          window_size_in_minutes: { type: integer }
          current_utc_evaluation_timestamp: { type: string, format: date-time }

    HAStateMessage:
      name: HAStateMessage
      contentType: text/plain
      payload:
        type: string
        enum: [detected, clear]

    AvailabilityMessage:
      name: AvailabilityMessage
      contentType: text/plain
      payload:
        type: string
        enum: [online, offline]

    CoordinatesPayload:
      name: CoordinatesPayload
      contentType: application/json
      payload:
        type: object
        properties:
          latitude: { type: number, format: float }
          longitude: { type: number, format: float }

    ClearedCommand:
      name: ClearedCommand
      contentType: application/json
      payload:
        type: object
        properties:
          motion_state: { type: string, enum: [empty] }

    SeqSyncMessage:
      name: SeqSyncMessage
      contentType: text/plain
      payload:
        type: string
        description: Integer string representing the sequence.

    BinStatusUpdate:
      name: BinStatusUpdate
      contentType: application/json
      payload:
        type: object
        properties:
          state: { type: string, enum: [emptied, active, maintenance] }
          emptied_at: { type: string, format: date-time }